[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pw-triage-bot"
version = "0.2.1"
description = "Triage and housekeeping for a patchwork project"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "click",
    "pathspec",
    "platformdirs",
    "pydantic",
    "peewee",
    "pyyaml",
    "requests",
    "unidiff",
]

[project.optional-dependencies]
dev = ["pytest", "ruff~=0.16.0"]

[project.scripts]
pw-triage-bot = "pw_triage_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pw_triage_bot"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
